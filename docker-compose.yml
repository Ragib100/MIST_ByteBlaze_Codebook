# Compose file for the codebook PDF build.
#
# Usage:
#   docker compose build
#   docker compose run --rm build
#
# After the run, notebook.pdf is written to the project root. The project's
# logs/ directory contains only the .aux, .log, .out, and .toc files from the
# latest PDF generation; other build artifacts stay in a Docker-managed volume.

services:
  build:
    build: .
    image: mist-codebook
    working_dir: /work
    env_file:
      - .env
    volumes:
      # Editable inputs from the host.
      - ./code:/work/code:rw
      - ./math:/work/math:rw
      - ./images:/work/images:rw

      # Single bind mount for the deliverable PDF only. On a fresh checkout
      # run `touch notebook.pdf` once so Docker bind-mounts it as a file
      # rather than creating it as a directory.
      - ./notebook.pdf:/work/notebook.pdf

      # Host directory for the selected LaTeX log files.
      - ./logs:/work/logs:rw
      # Keep all build output inside Docker; only selected files are copied
      # into logs/ after a successful build.
      - codebook-build:/var/build

    # generate_pdf.py reads the OUTPUT_DIRECTORY env var and passes
    # -output-directory=$OUTPUT_DIRECTORY to pdflatex. That sends
    # build artifacts and the final .pdf into /var/build, while pdflatex still
    # reads notebook.tex from /work, so
    # relative paths like \input{math/bhai} and \inputminted{...}{code/...}
    # resolve naturally.
    #
    # We then copy just the PDF back to /work (the host bind mount) so it
    # appears in the project root.
    command:
      - bash
      - -c
      - |
        set -e
        mkdir -p /var/build /work/logs
        find /work/logs -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        export OUTPUT_DIRECTORY=/var/build
        python3 /work/generate_pdf.py
        cp /var/build/notebook.pdf /work/notebook.pdf
        cp /var/build/notebook.aux /var/build/notebook.log \
          /var/build/notebook.out /var/build/notebook.toc /work/logs/

volumes:
  codebook-build: